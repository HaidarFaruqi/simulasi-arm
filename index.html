<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robot Arm URDF Simulator</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; }
    #editor-container { width: 450px; display: flex; flex-direction: column; border-right: 2px solid #ccc; background: #1e1e1e; }
    #header { padding: 15px; background: #252526; color: white; display: flex; justify-content: space-between; align-items: center; }
    #title-desc { font-size: 14px; font-weight: bold; }
    #code { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Courier New', Courier, monospace; font-size: 15px; padding: 15px; border: none; resize: none; outline: none; line-height: 1.5; }
    #viewer { flex: 1; position: relative; background: #f0f0f0; }
    button { padding: 8px 16px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005999; }
    button.stop { background: #cc3300; }
    button.stop:hover { background: #992600; }
  </style>
  
  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
  
  <!-- Cannon.js for Physics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

  <script>
    // FIX: urdf-loader UMD build expects STLLoader to be under window.STLLoader_js.STLLoader
    window.STLLoader_js = { STLLoader: THREE.STLLoader };
    window.ColladaLoader_js = { ColladaLoader: function(){} }; // mock collada loader
  </script>
  <script src="https://unpkg.com/urdf-loader@0.13.1/umd/URDFLoader.js"></script>
</head>
<body>

<div id="editor-container">
  <div id="header">
    <span id="title-desc">JavaScript Editor</span>
    <div>
      <select id="modeSelect" style="margin-right:10px; padding:6px; background:#333; color:white; border:1px solid #555; border-radius:4px; font-weight:bold;">
        <option value="code">Animasi Sederhana</option>
        <option value="joystick">Joystick (Fisika)</option>
      </select>
      <button id="runBtn">▶ Run</button>
      <button id="stopBtn" class="stop" style="display:none;">⏹ Stop</button>
    </div>
  </div>
  <textarea id="code" spellcheck="false">
// Tulis JavaScript murni Anda di sini!
// Tersedia fungsi delay(ms), joystick, dan objek robot.

async function loop() {
  // Putar dasar (Base) ke sudut 90 derajat (Math.PI/2)
  robot.joints['Revolute 1'].setJointValue(Math.PI / 2);
  
  // Tunggu 1 detik
  await delay(1000);
  
  // Putar kembali ke 0
  robot.joints['Revolute 1'].setJointValue(0);
  await delay(1000);
}
  </textarea>
</div>

<div id="viewer"></div>

<script>
  // ==========================================
  // PHYSICS SETUP (CANNON.JS)
  // ==========================================
  const world = new CANNON.World();
  world.gravity.set(0, -9.82, 0); // Gravitasi bumi
  world.broadphase = new CANNON.NaiveBroadphase();
  world.solver.iterations = 10;
  
  // Lantai (Fisika)
  const groundShape = new CANNON.Plane();
  const groundBody = new CANNON.Body({ mass: 0 }); // Mass 0 = Statis
  groundBody.addShape(groundShape);
  groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
  world.addBody(groundBody);

  // Array untuk menyimpan sinkronisasi bentuk (mesh -> body)
  const physicsSync = [];

  // ==========================================
  // THREE.JS & URDF SETUP
  // ==========================================
  const viewerEl = document.getElementById('viewer');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x263238); // Dark blueish gray

  const camera = new THREE.PerspectiveCamera(45, viewerEl.clientWidth / viewerEl.clientHeight, 0.1, 100);
  camera.position.set(0.6, 0.4, 0.6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(viewerEl.clientWidth, viewerEl.clientHeight);
  renderer.shadowMap.enabled = true;
  viewerEl.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.1, -0.1);
  controls.update();

  // Lights
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  // Grid / Floor (Visual)
  const grid = new THREE.GridHelper(5, 50, 0x888888, 0x444444);
  scene.add(grid);

  let robot = null;
  const manager = new THREE.LoadingManager();
  const loader = new URDFLoader(manager);
  
  loader.packages = {
    'Arm_description': './Arm/Arm/Arm_description/'
  };
  
  loader.load('Arm/Arm/Arm_description/urdf/Arm.xacro', result => {
    robot = result;
    window.robot = robot;
    
    // Rotasi standar ROS
    robot.rotation.x = -Math.PI / 2; 
    
    // Bikin hitboxes
    robot.traverse(c => {
      c.castShadow = true;
      c.receiveShadow = true;
      
      // Jika ini adalah jaring visual (Mesh), buatkan Kinematic Bounding Box
      if (c.isMesh && c.geometry) {
        c.geometry.computeBoundingBox();
        const bbox = c.geometry.boundingBox;
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const center = new THREE.Vector3();
        bbox.getCenter(center);
        
        // Buat box Cannon
        const shape = new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2));
        const body = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC });
        
        // Offset bentuk karena bounding box Three.js diukur dari lokal origin
        body.addShape(shape, new CANNON.Vec3(center.x, center.y, center.z));
        world.addBody(body);
        
        physicsSync.push({ mesh: c, body: body });
      }
    });
    scene.add(robot);
    
    // Set posisi awal tegak 90 derajat
    if (robot.joints['Revolute 1']) robot.joints['Revolute 1'].setJointValue(Math.PI/2);
    if (robot.joints['Revolute 2']) robot.joints['Revolute 2'].setJointValue(Math.PI/2);
    if (robot.joints['Revolute 3']) robot.joints['Revolute 3'].setJointValue(Math.PI/2);

    console.log("URDF Loaded with Physics!");
  });

  // ==========================================
  // OBJECT INTERAKTIF (KOTAK DINAMIS)
  // ==========================================
  // Tambahkan kotak yang bisa didorong oleh robot
  const boxGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
  const boxMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
  const boxMesh = new THREE.Mesh(boxGeo, boxMat);
  boxMesh.castShadow = true;
  scene.add(boxMesh);
  
  const boxShape = new CANNON.Box(new CANNON.Vec3(0.025, 0.025, 0.025));
  const boxBody = new CANNON.Body({ mass: 1.0 }); // mass > 0 = dinamis
  boxBody.addShape(boxShape);
  boxBody.position.set(0.15, 0.2, 0.0); // Taruh di atas udara biar jatuh
  world.addBody(boxBody);

  // Bola tambahan
  const sphereGeo = new THREE.SphereGeometry(0.03, 16, 16);
  const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffff00 });
  const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
  sphereMesh.castShadow = true;
  scene.add(sphereMesh);

  const sphereShape = new CANNON.Sphere(0.03);
  const sphereBody = new CANNON.Body({ mass: 0.5 });
  sphereBody.addShape(sphereShape);
  sphereBody.position.set(0.15, 0.3, 0.1);
  world.addBody(sphereBody);


  // ==========================================
  // RENDER & PHYSICS LOOP
  // ==========================================
  const timeStep = 1 / 60;
  
  function animate() {
    requestAnimationFrame(animate);
    
    // 1. Jalankan fisika
    world.step(timeStep);
    
    // 2. Sinkronkan posisi Robot -> Hitbox Kinematik
    const globalPos = new THREE.Vector3();
    const globalQuat = new THREE.Quaternion();
    
    for (let i = 0; i < physicsSync.length; i++) {
      const p = physicsSync[i];
      p.mesh.getWorldPosition(globalPos);
      p.mesh.getWorldQuaternion(globalQuat);
      
      p.body.position.copy(globalPos);
      p.body.quaternion.copy(globalQuat);
    }
    
    // 3. Sinkronkan Objek Fisika -> Tampilan 3D (Kotak & Bola)
    boxMesh.position.copy(boxBody.position);
    boxMesh.quaternion.copy(boxBody.quaternion);

    sphereMesh.position.copy(sphereBody.position);
    sphereMesh.quaternion.copy(sphereBody.quaternion);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = viewerEl.clientWidth / viewerEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(viewerEl.clientWidth, viewerEl.clientHeight);
  });

  // ==========================================
  // JS EDITOR RUNTIME
  // ==========================================
  const delay = ms => new Promise(res => setTimeout(res, ms));
  let _globalRunState = { isRunning: false, runId: 0 };

  function stopCode() {
    _globalRunState.isRunning = false;
    document.getElementById('runBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
  }
  document.getElementById('stopBtn').addEventListener('click', stopCode);

  async function runCode() {
    _globalRunState.isRunning = false; 
    _globalRunState.runId++;
    const currentRunId = _globalRunState.runId;
    
    document.getElementById('runBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    
    let rawCode = document.getElementById('code').value;
    
    const executorCode = `
      return (async function() {
        try {
          ${rawCode}
          
          _runState.isRunning = true;
          if (typeof loop === 'function') {
            while (_runState.isRunning && currentRunId === _runState.runId) {
              await loop();
              await delay(5); 
            }
          }
        } catch (err) {
          alert("Error eksekusi JavaScript: " + err.message);
          console.error(err);
        } finally {
          if (currentRunId === _runState.runId) {
             document.getElementById('runBtn').style.display = 'inline-block';
             document.getElementById('stopBtn').style.display = 'none';
          }
        }
      })();
    `;

    try {
      const virtualJoystick = {
        connected: function() {
          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for(let i=0; i<pads.length; i++) if(pads[i]) return true;
          return false;
        },
        getAxis: function(index) {
          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for(let i=0; i<pads.length; i++) {
            if(pads[i] && pads[i].axes.length > index) return pads[i].axes[index];
          }
          return 0.0;
        },
        getButton: function(index) {
          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for(let i=0; i<pads.length; i++) {
            if(pads[i] && pads[i].buttons.length > index) return pads[i].buttons[index].pressed;
          }
          return false;
        }
      };

      // Buat fungsi dengan argumen khusus
      const runFunc = new Function('robot', 'joystick', 'delay', '_runState', 'currentRunId', executorCode);
      await runFunc(robot, virtualJoystick, delay, _globalRunState, currentRunId);
    } catch (e) {
      console.error("Executor Error:", e);
      alert("Error struktural kode: " + e.message);
      stopCode();
    }
  }

  document.getElementById('runBtn').addEventListener('click', runCode);

  // ==========================================
  // TEMPLATES
  // ==========================================
  const modeSelect = document.getElementById('modeSelect');
  const codeArea = document.getElementById('code');
  
  const codeTemplateSweep = `// JavaScript murni: Animasi Menyapu
async function loop() {
  const baseJoint = robot.joints['Revolute 1'];
  const pMin = 0;
  const pMax = Math.PI;
  
  // Menyapu Kiri
  for(let p = pMax/2; p <= pMax; p += 0.05) {
    baseJoint.setJointValue(p);
    await delay(15);
  }
  // Menyapu Kanan
  for(let p = pMax; p >= pMin; p -= 0.05) {
    baseJoint.setJointValue(p);
    await delay(15);
  }
  // Kembali ke tengah
  for(let p = pMin; p <= pMax/2; p += 0.05) {
    baseJoint.setJointValue(p);
    await delay(15);
  }
  await delay(1000);
}`;

  const codeTemplateJoystick = `// Gunakan Joystick Anda untuk Mendorong Benda Fisika!
let posBase = Math.PI / 2;
let posBahu = Math.PI / 2;
let posSiku = Math.PI / 2;

async function loop() {
  if (joystick.connected()) {
    let axisX = joystick.getAxis(0);
    let axisY = joystick.getAxis(1);
    let axisSiku = joystick.getAxis(3);
    
    let deadzone = 0.1;
    let speed = 0.05; // radian per frame
    
    if (Math.abs(axisX) > deadzone) posBase += axisX * speed;
    if (Math.abs(axisY) > deadzone) posBahu += axisY * speed;
    if (Math.abs(axisSiku) > deadzone) posSiku += axisSiku * speed;
    
    // Batasi sudut (0 - 180 derajat)
    posBase = Math.max(0, Math.min(Math.PI, posBase));
    posBahu = Math.max(0, Math.min(Math.PI, posBahu));
    posSiku = Math.max(0, Math.min(Math.PI, posSiku));
    
    robot.joints['Revolute 1'].setJointValue(posBase);
    robot.joints['Revolute 2'].setJointValue(posBahu);
    robot.joints['Revolute 3'].setJointValue(posSiku);
    
    await delay(20);
  }
}`;

  modeSelect.addEventListener('change', (e) => {
    stopCode();
    if(e.target.value === 'joystick') {
      codeArea.value = codeTemplateJoystick;
    } else {
      codeArea.value = codeTemplateSweep;
    }
  });

</script>
</body>
</html>
