<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robot Arm URDF Simulator</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; }
    #editor-container { width: 450px; display: flex; flex-direction: column; border-right: 2px solid #ccc; background: #1e1e1e; }
    #header { padding: 15px; background: #252526; color: white; display: flex; justify-content: space-between; align-items: center; }
    #title-desc { font-size: 14px; font-weight: bold; }
    #code { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Courier New', Courier, monospace; font-size: 15px; padding: 15px; border: none; resize: none; outline: none; line-height: 1.5; }
    #viewer { flex: 1; position: relative; background: #f0f0f0; }
    button { padding: 8px 16px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005999; }
    button.stop { background: #cc3300; }
    button.stop:hover { background: #992600; }
  </style>
  
  <!-- Three.js and dependencies using ES Modules -->
  <!-- Three.js and dependencies using global scripts -->
  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
  <script>
    // FIX: urdf-loader UMD build expects STLLoader to be under window.STLLoader_js.STLLoader
    window.STLLoader_js = { STLLoader: THREE.STLLoader };
    window.ColladaLoader_js = { ColladaLoader: function(){} }; // mock collada loader
  </script>
  <script src="https://unpkg.com/urdf-loader@0.13.1/umd/URDFLoader.js"></script>
</head>
<body>

<div id="editor-container">
  <div id="header">
    <span id="title-desc">Arduino C++ Editor</span>
    <div>
      <button id="runBtn">▶ Run</button>
      <button id="stopBtn" class="stop" style="display:none;">⏹ Stop</button>
    </div>
  </div>
  <textarea id="code" spellcheck="false">
void setup() {
  // Uji Coba Semua Sendi (Termasuk Base)
}

void loop() {
  // Channel 0 = Revolute 1 (Base/Pangkal)
  // Channel 1 = Revolute 2 (Lengan Tengah)
  // Channel 2 = Revolute 3 (Ujung/Capit)

  // Kembali ke posisi tengah (Tegak lurus)
  pwm.setPWM(0, 0, 375); 
  pwm.setPWM(1, 0, 375); 
  pwm.setPWM(2, 0, 375); 
  delay(1000);

  // 1. Menggerakkan Servo Base (Channel 0)
  for(int p = 375; p <= 500; p += 2) {
    pwm.setPWM(0, 0, p);
    delay(15);
  }
  for(int p = 500; p >= 250; p -= 2) {
    pwm.setPWM(0, 0, p);
    delay(15);
  }
  for(int p = 250; p <= 375; p += 2) {
    pwm.setPWM(0, 0, p);
    delay(15);
  }
  delay(500);

  // 2. Menggerakkan Servo Lengan Tengah (Channel 1)
  for(int p = 375; p <= 500; p += 2) {
    pwm.setPWM(1, 0, p);
    delay(15);
  }
  for(int p = 500; p >= 250; p -= 2) {
    pwm.setPWM(1, 0, p);
    delay(15);
  }
  for(int p = 250; p <= 375; p += 2) {
    pwm.setPWM(1, 0, p);
    delay(15);
  }
  delay(500);

  // 3. Menggerakkan Servo Ujung (Channel 2)
  for(int p = 375; p <= 500; p += 2) {
    pwm.setPWM(2, 0, p);
    delay(15);
  }
  for(int p = 500; p >= 250; p -= 2) {
    pwm.setPWM(2, 0, p);
    delay(15);
  }
  for(int p = 250; p <= 375; p += 2) {
    pwm.setPWM(2, 0, p);
    delay(15);
  }
  delay(1000);
}
  </textarea>
</div>

<div id="viewer"></div>

<script>
  // ==========================================
  // THREE.JS & URDF SETUP
  // ==========================================
  const viewerEl = document.getElementById('viewer');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x263238); // Dark blueish gray

  const camera = new THREE.PerspectiveCamera(45, viewerEl.clientWidth / viewerEl.clientHeight, 0.1, 100);
  camera.position.set(0.6, 0.4, 0.6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(viewerEl.clientWidth, viewerEl.clientHeight);
  renderer.shadowMap.enabled = true;
  viewerEl.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.1, -0.1);
  controls.update();

  // Lights
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  // Grid / Floor
  const grid = new THREE.GridHelper(5, 50, 0x888888, 0x444444);
  scene.add(grid);

  let robot = null;
  const manager = new THREE.LoadingManager();
  const loader = new URDFLoader(manager);
  
  // Konfigurasi paket ROS
  loader.packages = {
    'Arm_description': './Arm/Arm/Arm_description/'
  };
  
  // Memuat file URDF/XACRO asli Anda
  loader.load('Arm/Arm/Arm_description/urdf/Arm.xacro', result => {
    robot = result;
    window.robot = robot; // Expose for debugging
    // Rotasi agar sumbu Z menghadap ke atas (standar ROS)
    robot.rotation.x = -Math.PI / 2; 
    
    robot.traverse(c => {
      c.castShadow = true;
      c.receiveShadow = true;
    });
    scene.add(robot);
    
    console.log("URDF Loaded! Available Joints:", Object.keys(robot.joints));
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = viewerEl.clientWidth / viewerEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(viewerEl.clientWidth, viewerEl.clientHeight);
  });

  // ==========================================
  // VIRTUAL PWM & C++ TRANSLATOR
  // ==========================================
  
  // Mapping Channel PCA9685 ke nama sendi di URDF Anda
  const jointMapping = {
    0: 'Revolute 1',
    1: 'Revolute 2',
    2: 'Revolute 3'
  };

  // Konversi pulse (150-600) ke radian (-90 s/d +90 derajat)
  function pulseToRad(pulse) {
    const pMin = 150, pMax = 600;
    const radMin = -Math.PI / 2, radMax = Math.PI / 2;
    // Batasi nilai
    pulse = Math.max(pMin, Math.min(pulse, pMax));
    return radMin + (pulse - pMin) * (radMax - radMin) / (pMax - pMin);
  }

  // Objek PWM tiruan
  const pwm = {
    setPWM: function(channel, on, off) {
      if(robot && jointMapping[channel] && robot.joints[jointMapping[channel]]) {
        const rad = pulseToRad(off);
        robot.joints[jointMapping[channel]].setJointValue(rad);
      }
    }
  };

  // Fungsi delay untuk loop asinkron
  const _delay = ms => new Promise(res => setTimeout(res, ms));

  let _globalRunState = { isRunning: false, runId: 0 };

  function stopCode() {
    _globalRunState.isRunning = false;
    document.getElementById('runBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
  }

  document.getElementById('stopBtn').addEventListener('click', stopCode);

  async function runCode() {
    // Reset status jalan sebelumnya
    _globalRunState.isRunning = false; 
    _globalRunState.runId++;
    const currentRunId = _globalRunState.runId;
    
    document.getElementById('runBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    
    let rawCode = document.getElementById('code').value;
    
    // --- TRANSLATOR C++ SEDERHANA KE JS ---
    let jsCode = rawCode;
    // Ubah tipe data
    jsCode = jsCode.replace(/\bint\s+/g, 'let ');
    jsCode = jsCode.replace(/\bfloat\s+/g, 'let ');
    jsCode = jsCode.replace(/\bdouble\s+/g, 'let ');
    
    // Ubah delay menjadi await
    jsCode = jsCode.replace(/\bdelay\s*\(/g, 'await _delay(');
    
    // Ubah void setup dan loop menjadi fungsi async
    jsCode = jsCode.replace(/\bvoid\s+setup\s*\(/g, 'async function _setup(');
    jsCode = jsCode.replace(/\bvoid\s+loop\s*\(/g, 'async function _loop(');
    
    // Bungkus eksekutor
    const executorCode = `
      return (async function() {
        try {
          ${jsCode}
          
          if (typeof _setup === 'function') {
            await _setup();
          }
          
          _runState.isRunning = true;
          if (typeof _loop === 'function') {
            while (_runState.isRunning && currentRunId === _runState.runId) {
              await _loop();
              // Jeda kecil agar browser tidak hang jika loop kosong
              await _delay(5); 
            }
          }
        } catch (err) {
          alert("Error pada logika kode Anda:\\n" + err.message);
          console.error(err);
        } finally {
          if (currentRunId === _runState.runId) {
             document.getElementById('runBtn').style.display = 'inline-block';
             document.getElementById('stopBtn').style.display = 'none';
          }
        }
      })();
    `;

    try {
      const runFunc = new Function('pwm', '_delay', '_runState', 'currentRunId', executorCode);
      await runFunc(pwm, _delay, _globalRunState, currentRunId);
    } catch (e) {
      console.error("Transpiler Error:", e);
      alert("Error struktural kode: \n" + e.message);
      stopCode();
    }
  }

  document.getElementById('runBtn').addEventListener('click', runCode);
</script>
</body>
</html>
